
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#001a14">
  <meta name="description" content="Oakmont account sign-in page">
  <title>Sign In | Oakmont Private Banking</title>
  <link rel="stylesheet" href="style.css">

  <style>
    :root {
      --login-input: #fffdbb;
      --login-input-text: #11170f;
    }

    body.login-page {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 50% 0%, #0b3025 0%, transparent 48%),
        #001a14;
    }

    .login-brand {
      padding: 16px 0 30px;
      text-align: center;
    }

    .login-brand a {
      display: inline-block;
    }

    .login-brand .brand-name {
      font-size: clamp(2rem, 7vw, 3.4rem);
      letter-spacing: .16em;
    }

    .login-brand .brand-subtitle {
      margin-top: 8px;
      font-size: .88rem;
      letter-spacing: .28em;
    }

    .login-card {
      width: min(100% - 28px, 820px);
      margin: 22px auto 34px;
      padding: clamp(26px, 6vw, 70px);
      border: 2px solid rgba(216,183,121,.38);
      border-radius: 30px;
      background: rgba(5,37,29,.94);
      box-shadow: 0 25px 75px rgba(0,0,0,.16);
    }

    .login-eyebrow {
      margin: 0 0 28px;
      color: var(--gold);
      font-size: clamp(.85rem, 2.5vw, 1.1rem);
      font-weight: 700;
      letter-spacing: .2em;
    }

    .login-heading {
      margin: 0 0 20px;
      color: #f5f2eb;
      font-size: clamp(2.7rem, 8vw, 5rem);
      font-weight: 400;
      letter-spacing: -.035em;
    }

    .login-description {
      margin: 0 0 54px;
      color: #a9bcb4;
      font-size: clamp(1.05rem, 3.5vw, 1.8rem);
      line-height: 1.65;
    }

    .login-form .form-group {
      margin-bottom: 32px;
    }

    .login-form label {
      margin-bottom: 12px;
      color: #f1f0e9;
      font-size: clamp(1rem, 3vw, 1.35rem);
    }

    .login-form input[type="email"],
    .login-form input[type="password"],
    .login-form input[type="text"] {
      min-height: 76px;
      padding: 18px 22px;
      border: 2px solid rgba(216,183,121,.6);
      border-radius: 17px;
      background: var(--login-input);
      color: var(--login-input-text);
      font-size: clamp(1rem, 3vw, 1.35rem);
      font-weight: 600;
    }

    .login-form input::placeholder {
      color: #737762;
    }

    .login-form input:focus {
      border-color: var(--gold-light);
      box-shadow: 0 0 0 4px rgba(216,183,121,.15);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 95px !important;
    }

    .password-toggle {
      position: absolute;
      top: 50%;
      right: 12px;
      min-height: 42px;
      padding: 8px 12px;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #856c36;
      font-size: 1rem;
    }

    .password-toggle:hover {
      transform: translateY(-50%);
      background: rgba(0,0,0,.05);
      color: #5e4b24;
    }

    .login-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      margin: 8px 0 48px;
    }

    .remember-option {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0;
      color: #a9bcb4 !important;
      font-size: clamp(.9rem, 2.8vw, 1.2rem) !important;
      cursor: pointer;
    }

    .remember-option input {
      width: 25px;
      height: 25px;
      min-height: 25px;
      flex: 0 0 25px;
      accent-color: var(--gold);
    }

    .forgot-link {
      color: var(--gold-light);
      font-size: clamp(.9rem, 2.8vw, 1.2rem);
      white-space: nowrap;
    }

    .login-submit {
      width: 100%;
      min-height: 86px;
      border: 1px solid var(--gold-light);
      border-radius: 17px;
      background: #f0d49a;
      color: #09271c;
      font-size: clamp(1.2rem, 3.5vw, 1.7rem);
      font-weight: 800;
    }

    .login-submit:hover {
      background: #ffe3ac;
      color: #09271c;
    }

    .login-submit span {
      font-size: 1.4em;
      line-height: 1;
    }

    .register-prompt {
      margin: 46px 0 4px;
      color: #a9bcb4;
      font-size: clamp(.95rem, 3vw, 1.3rem);
      text-align: center;
    }

    .register-prompt a {
      color: var(--gold-light);
    }

    .login-footer {
      width: min(100% - 28px, 900px);
      margin: 0 auto;
      padding: 12px 0 30px;
      color: #9bafa7;
      text-align: center;
      font-size: .88rem;
    }

    .login-footer p {
      margin: 8px 0;
      color: inherit;
    }

    .login-footer a {
      color: var(--gold-light);
    }

    .login-message {
      margin-bottom: 28px;
      padding: 17px 20px;
      border: 1px solid var(--border);
      border-radius: 15px;
      color: var(--muted);
      font-size: 1rem;
      overflow-wrap: anywhere;
    }

    .login-message.error {
      border-color: rgba(241,165,165,.65);
      color: #ffb4aa;
    }

    .login-message.success {
      border-color: rgba(130,201,162,.65);
      color: var(--green);
    }

    @media (max-width: 520px) {
      .login-brand {
        padding: 18px 0 28px;
      }

      .login-card {
        margin-top: 18px;
        border-radius: 25px;
      }

      .login-description {
        margin-bottom: 36px;
      }

      .login-form .form-group {
        margin-bottom: 25px;
      }

      .login-form input[type="email"],
      .login-form input[type="password"],
      .login-form input[type="text"] {
        min-height: 64px;
        padding: 15px;
        border-radius: 14px;
      }

      .login-options {
        margin-bottom: 34px;
      }

      .remember-option {
        gap: 9px;
      }

      .login-submit {
        min-height: 72px;
      }

      .register-prompt {
        margin-top: 34px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body class="login-page">

  <header class="login-brand">
    <a href="index.html" aria-label="Oakmont home">
      <span class="brand-name">OAKMONT</span>
      <span class="brand-subtitle">PRIVATE BANKING</span>
    </a>
  </header>

  <main>
    <section class="login-card">
      <p class="login-eyebrow">SECURE ACCOUNT ACCESS</p>

      <h1 class="login-heading">Welcome back.</h1>

      <p class="login-description">
        Sign in to continue to your Oakmont account.
      </p>

      <div id="login-message"
           class="login-message hidden"
           role="status"
           aria-live="polite"></div>

      <form id="login-form" class="login-form">
        <div class="form-group">
          <label for="email">Email address</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="username"
            placeholder="you@example.com"
            maxlength="254"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>

          <div class="password-wrap">
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Enter your password"
              required
            >

            <button
              class="password-toggle"
              id="password-toggle"
              type="button"
              aria-controls="password"
              aria-pressed="false"
            >Show</button>
          </div>
        </div>

        <div class="login-options">
          <label class="remember-option" for="remember-email">
            <input
              id="remember-email"
              type="checkbox"
            >
            <span>Remember email on this device</span>
          </label>

          <a class="forgot-link" href="reset-password.html">
            Forgot password?
          </a>
        </div>

        <button class="login-submit" type="submit">
          Sign In <span aria-hidden="true">→</span>
        </button>
      </form>

      <p class="register-prompt">
        New to Oakmont?
        <a href="register.html">Create an account</a>
      </p>
    </section>
  </main>

  <footer class="login-footer">
    <p>Keep your password private. Never share your sign-in details.</p>
    <p>Oakmont account-management website.</p>
    <p><a href="index.html">Back to home</a></p>
  </footer>

  <script>
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const rememberEmail = document.getElementById("remember-email");
    const passwordToggle = document.getElementById("password-toggle");
    const loginForm = document.getElementById("login-form");
    const loginMessage = document.getElementById("login-message");

    function showMessage(text, type) {
      loginMessage.textContent = text;
      loginMessage.className = "login-message " + (type || "");
    }

    passwordToggle.addEventListener("click", function () {
      const isHidden = passwordInput.type === "password";

      passwordInput.type = isHidden ? "text" : "password";
      passwordToggle.textContent = isHidden ? "Hide" : "Show";
      passwordToggle.setAttribute("aria-pressed", String(isHidden));
    });

    try {
      const savedEmail = localStorage.getItem("oakmont_saved_email");

      if (savedEmail) {
        emailInput.value = savedEmail;
        rememberEmail.checked = true;
      }
    } catch (error) {
      // Remember-email is optional if browser storage is unavailable.
    }

    loginForm.addEventListener("submit", function (event) {
      event.preventDefault();

      if (!loginForm.reportValidity()) return;

      try {
        if (rememberEmail.checked) {
          localStorage.setItem(
            "oakmont_saved_email",
            emailInput.value.trim()
          );
        } else {
          localStorage.removeItem("oakmont_saved_email");
        }
      } catch (error) {
        // Authentication must not depend on local storage.
      }

      showMessage(
        "Sign-in is not connected yet. Configure the authentication service before signing in.",
        "error"
      );
    });
  </script>

</body>
</html>
