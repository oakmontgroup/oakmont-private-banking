
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#001a14">
  <title>Create Your Account | Oakmont Private Banking</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body.register-page {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at top, #0b3025, transparent 52%),
        #001a14;
    }

    .register-card {
      width: min(100% - 28px, 820px);
      margin: 14px auto 38px;
      padding: clamp(25px, 5vw, 52px);
      border: 2px solid rgba(216,183,121,.34);
      border-radius: 28px;
      background: rgba(5,37,29,.94);
      box-shadow: 0 25px 70px rgba(0,0,0,.18);
    }

    .register-brand {
      margin: 0 auto 55px;
      text-align: center;
    }

    .register-symbol {
      display: block;
      margin-bottom: 18px;
      color: var(--gold);
      font-size: 3rem;
      line-height: 1;
    }

    .register-brand .brand-name {
      font-size: clamp(2rem, 7vw, 3rem);
      letter-spacing: .15em;
    }

    .register-brand .brand-subtitle {
      margin-top: 8px;
      font-size: .85rem;
      letter-spacing: .27em;
    }

    .register-heading {
      margin: 0 0 20px;
      color: #f3f0e8;
      font-size: clamp(2.2rem, 6vw, 3.5rem);
      font-weight: 400;
      text-align: center;
    }

    .register-description {
      margin: 0 0 48px;
      color: #a9b8b0;
      font-size: clamp(1rem, 3vw, 1.45rem);
      line-height: 1.7;
      text-align: center;
    }

    .register-form .form-group {
      margin-bottom: 29px;
    }

    .register-form label {
      margin-bottom: 12px;
      color: #f3f0e8;
      font-size: clamp(1rem, 3vw, 1.25rem);
    }

    .register-form input {
      min-height: 72px;
      padding: 18px 22px;
      border: 2px solid rgba(216,183,121,.34);
      border-radius: 15px;
      background: #001c15;
      color: #f3f0e8;
      font-size: clamp(1rem, 3vw, 1.3rem);
      font-weight: 600;
    }

    .register-form input::placeholder {
      color: #81968c;
      opacity: 1;
    }

    .register-form input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(216,183,121,.12);
    }

    .register-help {
      margin: 12px 0 0;
      color: #a9b8b0;
      font-size: .95rem;
    }

    .register-submit {
      width: 100%;
      min-height: 76px;
      margin-top: 12px;
      border: 1px solid var(--gold-light);
      border-radius: 15px;
      background: #f0d49a;
      color: #10251d;
      font-size: 1.25rem;
      font-weight: 800;
    }

    .register-submit:hover {
      background: #ffe3ac;
      color: #10251d;
    }

    .register-footer {
      margin: 30px 0 0;
      color: #a9b8b0;
      text-align: center;
    }

    .register-footer a {
      color: var(--gold-light);
    }

    .register-message {
      margin-bottom: 25px;
      padding: 15px;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow-wrap: anywhere;
    }

    .register-message.error {
      color: #ffb4aa;
      border-color: rgba(241,165,165,.6);
    }

    @media(max-width:520px) {
      .register-card {
        padding: 24px 20px;
        border-radius: 23px;
      }

      .register-brand {
        margin-bottom: 42px;
      }

      .register-description {
        margin-bottom: 35px;
      }

      .register-form .form-group {
        margin-bottom: 24px;
      }

      .register-form input {
        min-height: 64px;
        padding: 15px;
      }

      .register-submit {
        min-height: 68px;
      }
    }
  </style>
</head>

<body class="register-page">

  <main class="register-card">
    <header class="register-brand">
      <a href="index.html" aria-label="Oakmont home">
        <span class="register-symbol" aria-hidden="true">♣</span>
        <span class="brand-name">OAKMONT</span>
        <span class="brand-subtitle">PRIVATE BANKING</span>
      </a>
    </header>

    <h1 class="register-heading">Create Your Account</h1>

    <p class="register-description">
      Complete the form below to register for Oakmont Online Banking.
    </p>

    <div id="register-message"
         class="register-message hidden"
         role="status"
         aria-live="polite"></div>

    <form id="register-form" class="register-form">
      <div class="form-group">
        <label for="first-name">First name *</label>
        <input id="first-name" name="firstName"
               type="text" autocomplete="given-name"
               maxlength="80" required
               placeholder="First name">
      </div>

      <div class="form-group">
        <label for="last-name">Last name *</label>
        <input id="last-name" name="lastName"
               type="text" autocomplete="family-name"
               maxlength="80" required
               placeholder="Last name">
      </div>

      <div class="form-group">
        <label for="phone">Phone number (optional)</label>
        <input id="phone" name="phone"
               type="tel" autocomplete="tel"
               maxlength="30"
               placeholder="Enter phone number">
      </div>

      <div class="form-group">
        <label for="email">Email address *</label>
        <input id="email" name="email"
               type="email" autocomplete="email"
               maxlength="254" required
               placeholder="you@example.com">
      </div>

      <div class="form-group">
        <label for="password">Password *</label>
        <input id="password" name="password"
               type="password" autocomplete="new-password"
               minlength="12" required
               placeholder="At least 12 characters">
        <p class="register-help">
          Use a strong, unique password that you do not use elsewhere.
        </p>
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirm password *</label>
        <input id="confirm-password" name="confirmPassword"
               type="password" autocomplete="new-password"
               minlength="12" required
               placeholder="Enter your password again">
      </div>

      <button class="register-submit" type="submit">
        Create Account →
      </button>
    </form>

    <p class="register-footer">
      Already registered?
      <a href="login.html">Sign in</a>
    </p>
    <p class="register-footer">
      <a href="index.html">Back to home</a>
    </p>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© <span id="year"></span> Oakmont Private Banking</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  document.getElementById("year").textContent =
    new Date().getFullYear();

  const SUPABASE_URL = "https://oakmontgroup.github.io/oakmont-private-banking/";
  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_dVi-_qsBmlJANURtQob6fw_CVdY6GDK";

  const { createClient } = window.supabase;
  const supabaseClient = createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const form = document.getElementById("register-form");
  const password = document.getElementById("password");
  const confirmation = document.getElementById("confirm-password");
  const message = document.getElementById("register-message");
  const submitButton = form.querySelector('button[type="submit"]');

  function showMessage(text, type) {
    message.className = "register-message " + (type || "");
    message.textContent = text;
    message.style.display = "block";
  }

  form.addEventListener("submit", async function(event) {
    event.preventDefault();

    if (!form.reportValidity()) return;

    if (
      SUPABASE_URL.includes("PASTE_") ||
      SUPABASE_PUBLISHABLE_KEY.includes("PASTE_")
    ) {
      showMessage("Supabase settings are not configured yet.", "error");
      return;
    }

    if (password.value !== confirmation.value) {
      showMessage("Your passwords do not match.", "error");
      confirmation.focus();
      return;
    }

    submitButton.disabled = true;
    submitButton.textContent = "Creating account…";

    try {
      const email = document.getElementById("email").value.trim();
      const firstName =
        document.getElementById("first-name").value.trim();
      const lastName =
        document.getElementById("last-name").value.trim();
      const phone = document.getElementById("phone").value.trim();

      const emailRedirectTo = new URL(
        "login.html",
        window.location.href
      ).href;

      const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password.value,
        options: {
          emailRedirectTo: emailRedirectTo,
          data: {
            first_name: firstName,
            last_name: lastName,
            phone: phone
          }
        }
      });

      if (error) throw error;

      if (data.session) {
        showMessage(
          "Your account was created successfully. Opening sign-in…",
          "success"
        );

        window.location.assign("dashboard.html");
        return;
      }

      showMessage(
        "Your registration request was submitted. If confirmation is required, check your email and follow the confirmation link before signing in.",
        "success"
      );

      form.reset();
    } catch (error) {
      showMessage(
        error.message || "Registration failed. Please try again.",
        "error"
      );
    } finally {
      submitButton.disabled = false;
      submitButton.textContent = "Create Account →";
    }
  });
</script>
