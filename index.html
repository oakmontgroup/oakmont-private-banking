<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://qzyxcboyjqtxqqcxveil.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_km5xwN4pFYUp3-ZvCjniQw_CpMvDKBz';
const STARTING_BALANCE = 35000;
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
let currentUser = null;
let account = null;
const $ = id => document.getElementById(id);
const money = n => new Intl.NumberFormat('en-CA', {
  style: 'currency',
  currency: 'CAD'
}).format(Number(n) || 0);
function message(id, text, ok = false) {
  const el = $(id);
  el.textContent = text;
  el.className = 'msg ' + (ok ? 'success' : 'error');
}
function showDashboard(show) {
  $('authView').classList.toggle('hidden', show);
  $('dashboard').classList.toggle('hidden', !show);
}
$('showSignUp').addEventListener('click', () => {
  $('signInPanel').classList.add('hidden');
  $('signUpPanel').classList.remove('hidden');
});
$('showSignIn').addEventListener('click', () => {
  $('signUpPanel').classList.add('hidden');
  $('signInPanel').classList.remove('hidden');
});
function render() {
  if (!account) return;
  $('ownerName').textContent =
    (account.owner_name || currentUser?.email || 'TIANNA JACK')
      .toLocaleUpperCase();
  $('balance').textContent = money(account.balance);
  const list = Array.isArray(account.transactions)
    ? account.transactions
    : [];
  $('transactions').replaceChildren();
  if (!list.length) {
    const empty = document.createElement('p');
    empty.className = 'empty';
    empty.textContent = 'No records yet. Add a personal record to begin.';
    $('transactions').append(empty);
    return;
  }
  list.slice().reverse().slice(0, 20).forEach(tx => {
    const row = document.createElement('div');
    row.className = 'tx';
    const left = document.createElement('div');
    const strong = document.createElement('strong');
    strong.textContent = tx.description;
    const small = document.createElement('small');
    small.textContent = new Date(tx.created_at).toLocaleString();
    left.append(strong, small);
    const amount = document.createElement('div');
    amount.className = 'amount';
    amount.textContent =
      (tx.type === 'credit' ? '+' : '−') + money(tx.amount);
    amount.style.color =
      tx.type === 'credit' ? 'var(--green)' : 'var(--red)';
    row.append(left, amount);
    $('transactions').append(row);
  });
}
async function loadAccount(user) {
  currentUser = user;
  const { data, error } = await db
    .from('demo_accounts')
    .select('*')
    .eq('user_id', user.id)
    .maybeSingle();
  if (error) throw error;
  if (!data) {
    const displayName = (
      user.user_metadata?.display_name || 'TIANNA JACK'
    ).toString().slice(0, 80).toLocaleUpperCase();
    const { data: created, error: createError } = await db
      .from('demo_accounts')
      .insert({
        user_id: user.id,
        owner_name: displayName,
        balance: STARTING_BALANCE,
        transactions: []
      })
      .select()
      .single();
    if (createError) throw createError;
    account = created;
  } else {
    account = data;
  }
  showDashboard(true);
  render();
}
async function init() {
  try {
    const { data, error } = await db.auth.getSession();
    if (error) throw error;
    if (data.session) {
      await loadAccount(data.session.user);
    } else {
      showDashboard(false);
    }
    db.auth.onAuthStateChange((_event, session) => {
      setTimeout(async () => {
        try {
          if (session) {
            await loadAccount(session.user);
          } else {
            currentUser = null;
            account = null;
            showDashboard(false);
          }
        } catch (err) {
          showDashboard(false);
          message('signInMsg', 'Could not load account: ' + err.message);
        }
      }, 0);
    });
  } catch (err) {
    showDashboard(false);
    message('signInMsg', 'Connection error: ' + err.message);
  }
}
$('signInForm').addEventListener('submit', async e => {
  e.preventDefault();
  message('signInMsg', 'Signing in…', true);
  const { error } = await db.auth.signInWithPassword({
    email: $('signInEmail').value.trim(),
    password: $('signInPassword').value
  });
  if (error) {
    message('signInMsg', error.message);
  } else {
    message('signInMsg', 'Signed in successfully.', true);
  }
});
$('signUpForm').addEventListener('submit', async e => {
  e.preventDefault();
  message('signUpMsg', 'Creating account…', true);
  const name = $('signUpName').value.trim();
  const { data, error } = await db.auth.signUp({
    email: $('signUpEmail').value.trim(),
    password: $('signUpPassword').value,
    options: {
      data: { display_name: name }
    }
  });
  if (error) {
    message('signUpMsg', error.message);
    return;
  }
  if (data.session) {
    try {
      await loadAccount(data.session.user);
      message('signUpMsg', 'Account created successfully.', true);
    } catch (err) {
      message('signUpMsg',
        'Account created, but the database needs attention: ' + err.message);
    }
  } else {
    message('signUpMsg',
      'Check your email for the confirmation link, then sign in.', true);
  }
});
$('entryForm').addEventListener('submit', async e => {
  e.preventDefault();
  if (!account || !currentUser) return;
  const amount = Number($('entryAmount').value);
  const type = $('entryType').value;
  const description = $('entryDescription').value.trim();
  if (!description || !Number.isFinite(amount) || amount <= 0) {
    message('entryMsg', 'Enter a description and an amount greater than zero.');
    return;
  }
  const nextBalance = Number(account.balance) +
    (type === 'credit' ? amount : -amount);
  if (nextBalance < 0) {
    message('entryMsg', 'The sample balance cannot be negative.');
    return;
  }
  const nextTransactions = [
    ...(account.transactions || []),
    {
      id: crypto.randomUUID(),
      description,
      amount,
      type,
      created_at: new Date().toISOString()
    }
  ];
  const { data, error } = await db
    .from('demo_accounts')
    .update({
      balance: nextBalance,
      transactions: nextTransactions
    })
    .eq('user_id', currentUser.id)
    .select()
    .single();
  if (error) {
    message('entryMsg', 'Could not save: ' + error.message);
    return;
  }
  account = data;
  render();
  $('entryForm').reset();
  message('entryMsg', 'Record saved.', true);
});
$('resetBtn').addEventListener('click', async () => {
  if (!account || !currentUser) return;
  if (!confirm('Reset the sample balance to CA$35,000 and remove all records?')) {
    return;
  }
  const { data, error } = await db
    .from('demo_accounts')
    .update({
      balance: STARTING_BALANCE,
      transactions: []
    })
    .eq('user_id', currentUser.id)
    .select()
    .single();
  if (error) {
    message('entryMsg', 'Could not reset: ' + error.message);
    return;
  }
  account = data;
  render();
  message('entryMsg', 'Records reset.', true);
});
$('signOutBtn').addEventListener('click', async () => {
  const { error } = await db.auth.signOut();
  if (error) message('entryMsg', 'Sign-out error: ' + error.message);
});
init();
</script>
</body>
</html>
